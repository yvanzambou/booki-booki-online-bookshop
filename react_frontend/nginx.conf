server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API-Aufrufe an das Backend-Container weiterreichen (kein CORS noetig)
    location /booki-booki/ {
        proxy_pass http://backend:8080/booki-booki/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React-Router: unbekannte Pfade (z. B. /book/5) liefern index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
