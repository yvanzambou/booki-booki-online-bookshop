spring.application.name=booki-booki

# --- Datenbank (per Umgebungsvariable ueberschreibbar, Defaults fuer lokale Entwicklung) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booki_booki_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Automatische Schema-Aktualisierung (nur fuer Entwicklung!)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# SQL Logging (SHOW_SQL=true zum Aktivieren)
spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- CORS: erlaubte Frontend-Origins, kommagetrennt ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- CSV-Import ---
app.csv.path=${CSV_PATH:./data/books.csv}
app.csv.max-books=${CSV_MAX_BOOKS:50}
app.csv.import-on-startup=${CSV_IMPORT_ON_STARTUP:true}
