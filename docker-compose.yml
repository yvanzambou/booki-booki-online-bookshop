
services:
  db:
    image: mysql:8.4
    container_name: booki-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-booki_booki_db}
      MYSQL_USER: ${DB_USERNAME:-booki}
      MYSQL_PASSWORD: ${DB_PASSWORD:-booki_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Host-Port 3307, MySQL-Port im Container 3306
      - "127.0.0.1:3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./springboot_backend
    container_name: booki-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/${DB_NAME:-booki_booki_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${DB_USERNAME:-booki}
      DB_PASSWORD: ${DB_PASSWORD:-booki_pass}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      CSV_PATH: /data/books.csv
      CSV_IMPORT_ON_STARTUP: "true"
    volumes:
      - ./data:/data:ro
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./react_frontend
      args:
        VITE_API_URL: /booki-booki
    container_name: booki-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data: